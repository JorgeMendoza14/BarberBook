{# Formulario compartido por "Reservar" y "Editar".
   Si llega la variable cita, los campos se llenan con sus datos. #}
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<label>
    Barbero
    <select name="id_barbero" required>
        <option value="">Selecciona un barbero</option>
        {% for barbero in barberos %}
            <option value="{{ barbero.id_barbero }}"
                {% if cita and cita.id_barbero == barbero.id_barbero %}selected{% endif %}>
                {{ barbero.nombre }}{% if barbero.especialidad %} — {{ barbero.especialidad }}{% endif %}
            </option>
        {% endfor %}
    </select>
</label>
<label>
    Servicio
    <select name="id_servicio" required>
        <option value="">Selecciona un servicio</option>
        {% for servicio in servicios %}
            <option value="{{ servicio.id_servicio }}"
                {% if cita and cita.id_servicio == servicio.id_servicio %}selected{% endif %}>
                {{ servicio.nombre }} — ${{ '%.2f'|format(servicio.precio) }} ({{ servicio.duracion_minutos }} min)
            </option>
        {% endfor %}
    </select>
</label>
<label>
    Fecha
    <input type="date" name="fecha" min="{{ hoy }}" required
           value="{{ cita.fecha if cita else '' }}">
</label>
<div class="admin-field-wide campo-horas">
    <span class="campo-titulo">Hora disponible</span>
    {# La hora elegida se guarda en este campo oculto (lo llena reservas.js) #}
    <input type="hidden" name="hora" value="{{ cita.hora if cita else '' }}">
    <div class="horas-grid" id="horas-disponibles"
         data-url="{{ url_for('disponibilidad') }}"
         data-id-cita="{{ cita.id_cita if cita else '' }}">
        <p class="horas-mensaje">Elige barbero, servicio y fecha para ver las horas libres.</p>
    </div>
    <div class="horario-barbero" id="horario-barbero"></div>
</div>
<label class="admin-field-wide">
    Observaciones
    <textarea name="observaciones" rows="3"
              placeholder="Ej: corte bajo a los lados">{{ cita.observaciones if cita and cita.observaciones else '' }}</textarea>
</label>
