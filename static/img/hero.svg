<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" role="img" aria-label="Ilustración de barbería">
  <defs>
    <radialGradient id="brillo" cx="50%" cy="45%" r="55%">
      <stop offset="0" stop-color="#d4af37" stop-opacity=".28"/>
      <stop offset="1" stop-color="#d4af37" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="oro" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3d778"/>
      <stop offset="1" stop-color="#b08a1e"/>
    </linearGradient>
    <linearGradient id="vidrio" x1="0" x2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".0"/>
      <stop offset=".35" stop-color="#fff" stop-opacity=".35"/>
      <stop offset=".6" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="tubo"><rect x="196" y="118" width="88" height="244" rx="10"/></clipPath>
    <pattern id="rayas" width="88" height="66" patternUnits="userSpaceOnUse" patternTransform="skewY(-28)">
      <rect width="88" height="66" fill="#f5f5f5"/>
      <rect y="0" width="88" height="18" fill="#c0392b"/>
      <rect y="33" width="88" height="18" fill="#1f4e9c"/>
    </pattern>
  </defs>

  <circle cx="240" cy="240" r="230" fill="url(#brillo)"/>
  <circle cx="240" cy="240" r="196" fill="none" stroke="#d4af37" stroke-opacity=".35" stroke-width="2"/>
  <circle cx="240" cy="240" r="176" fill="none" stroke="#d4af37" stroke-opacity=".18" stroke-width="1" stroke-dasharray="4 8"/>

  <!-- Poste de barberia -->
  <rect x="186" y="84" width="108" height="34" rx="12" fill="url(#oro)"/>
  <circle cx="240" cy="76" r="16" fill="url(#oro)"/>
  <g clip-path="url(#tubo)">
    <rect x="196" y="80" width="88" height="320" fill="url(#rayas)"/>
    <rect x="196" y="118" width="88" height="244" fill="url(#vidrio)"/>
  </g>
  <rect x="196" y="118" width="88" height="244" rx="10" fill="none" stroke="#d4af37" stroke-width="4"/>
  <rect x="186" y="362" width="108" height="34" rx="12" fill="url(#oro)"/>
  <rect x="210" y="396" width="60" height="14" rx="6" fill="#b08a1e"/>

  <!-- Tijeras -->
  <g transform="translate(360 300) rotate(-35)" fill="none" stroke="url(#oro)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="-26" cy="58" r="20"/>
    <circle cx="26" cy="58" r="20"/>
    <path d="M-14 42 L6 -70"/>
    <path d="M14 42 L-6 -70"/>
    <circle cx="0" cy="0" r="4" fill="#d4af37"/>
  </g>

  <!-- Peine -->
  <g transform="translate(110 300) rotate(30)">
    <rect x="-18" y="-80" width="36" height="160" rx="8" fill="url(#oro)"/>
    <g stroke="#101010" stroke-width="4">
      <path d="M-4 -70 H18"/><path d="M-4 -56 H18"/><path d="M-4 -42 H18"/>
      <path d="M-4 -28 H18"/><path d="M-4 -14 H18"/><path d="M-4 0 H18"/>
      <path d="M-4 14 H18"/><path d="M-4 28 H18"/><path d="M-4 42 H18"/>
      <path d="M-4 56 H18"/><path d="M-4 70 H18"/>
    </g>
  </g>

  <!-- Destellos -->
  <g fill="#f3d778">
    <path d="M380 120 l5 14 l14 5 l-14 5 l-5 14 l-5 -14 l-14 -5 l14 -5z"/>
    <path d="M96 150 l3 9 l9 3 l-9 3 l-3 9 l-3 -9 l-9 -3 l9 -3z"/>
    <path d="M400 400 l3 9 l9 3 l-9 3 l-3 9 l-3 -9 l-9 -3 l9 -3z"/>
  </g>
</svg>
